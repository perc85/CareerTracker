services:
  frontend:
    build: "./frontend"
    ports:
      - "3000:3000"
    env_file:
      - "./frontend/.env"
  backend:
    build: "./backend"
    command: sh -c "flask db upgrade && python app.py"
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - "./backend/.env"
    environment:
      - DATABASE_URL=${DATABASE_URL}
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
